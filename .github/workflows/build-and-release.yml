name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: napi-mbt-linux-x64-gnu
            src_dir: linux-x64-gnu
          # MoonBit currently ships a macOS toolchain only for Apple Silicon.
          - os: macos-latest
            artifact_name: napi-mbt-darwin-arm64
            src_dir: darwin-arm64
          - os: windows-latest
            artifact_name: napi-mbt-win32-x64-msvc
            src_dir: win32-x64-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update Registry & Dependencies
        run: moon update

      - name: Build native CLI
        run: moon build --target native --release cmd/napi-mbt-cli

      - name: Build Native Module
        run: moon run --target native --release cmd/napi-mbt-cli -- build --release

      - name: Strict MoonBit check
        run: moon check --target native --warn-list +73 --deny-warn

      - name: CI regression tests
        run: moon run scripts/ci-regression-test.mbtx

      - name: MoonBit tests
        run: moon test --target native

      - name: Parser FFI AddressSanitizer tests
        # The hosted Windows image's MSVC ASan runtime currently cannot start
        # MoonBit's generated test executables (0xc0000139). Native parser
        # coverage is still exercised by the MoonBit test step above.
        if: runner.os != 'Windows'
        run: moon run scripts/parser-asan-test.mbtx

      - name: Setup Node for addon load tests
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load addons in Node
        run: node --test scripts/test.js

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p artifacts_export
          cp artifacts/${{ matrix.src_dir }}/napi_mbt.node artifacts_export/${{ matrix.artifact_name }}.node

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts_export/${{ matrix.artifact_name }}.node
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build, cli]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.node
            artifacts/*.tar.gz
          generate_release_notes: true

  cli:
    name: Build MoonBit CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: napi-mbt-linux-amd64
          # MoonBit currently ships a macOS toolchain only for Apple Silicon.
          - os: macos-latest
            asset_name: napi-mbt-macos-arm64
          - os: windows-latest
            asset_name: napi-mbt-windows-amd64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
      - name: Update Registry & Dependencies
        run: moon update
      - name: Build native CLI
        run: moon build --release --target native cmd/napi-mbt-cli
      - name: Package standalone native CLI
        run: moon run scripts/package-cli.mbtx ${{ matrix.asset_name }}
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz

  publish-mooncakes:
    name: Publish MoonBit module
    needs: [build, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - name: Verify module version
        shell: bash
        run: |
          module_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' moon.mod | head -n 1)"
          test "v${module_version}" = "${GITHUB_REF_NAME}"
      - name: Configure Mooncakes credentials
        env:
          MOONCAKES_CREDENTIALS: ${{ secrets.MOONCAKES_CREDENTIALS }}
        run: |
          test -n "$MOONCAKES_CREDENTIALS"
          install -d -m 700 "$HOME/.moon"
          printf '%s' "$MOONCAKES_CREDENTIALS" > "$HOME/.moon/credentials.json"
          chmod 600 "$HOME/.moon/credentials.json"
      - run: moon publish
