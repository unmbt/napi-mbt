name: Build and distribution gates

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_VERSION: '0.10.15+943464bfa'
  CMAKE_VERSION: '4.4.4'

jobs:
  build:
    name: Native gates (${{ matrix.os }})
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-gnu
            asset: napi-mbt-linux-amd64
          - os: macos-15
            target: darwin-arm64
            asset: napi-mbt-macos-arm64
          - os: windows-2025
            target: win32-x64-msvc
            asset: napi-mbt-windows-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
      - run: moon update
      - run: npm ci --ignore-scripts
      - run: moon run scripts/toolchain-check.mbtx
      # Project checking downloads dependencies; `moon update` only updates the registry.
      - run: moon check --target native --warn-list +73 --deny-warn
      - run: moon run scripts/sync-runtime.mbtx --check
      - run: moon run scripts/sync-async-adapter.mbtx --check
      - run: moon run scripts/release-check.mbtx
      - run: moon run scripts/docs-check.mbtx
      - run: moon build --target native --release cmd/napi-mbt-cli
      - run: moon run --target native --release cmd/napi-mbt-cli -- doctor --json
      - run: moon run --target native --release cmd/napi-mbt-cli -- build --release --verbose
      # The root foreign library is exercised by Node consumers, not a standalone test executable.
      - run: moon test --target native cmd/napi-mbt-cli generator internal/syntax internal/assets
      - run: moon run scripts/ci-regression-test.mbtx
      - run: moon run scripts/ci-consumers.mbtx
      - run: moon run scripts/package-cli.mbtx ${{ matrix.asset }}
      - run: moon run scripts/mooncake-package-test.mbtx
      - run: moon run scripts/ci-artifacts.mbtx
      - uses: actions/upload-artifact@v4
        with:
          name: consumers-${{ matrix.target }}
          path: dist/consumer-fixtures/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  node:
    name: Node ${{ matrix.node }} (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        target: [linux-x64-gnu, darwin-arm64, win32-x64-msvc]
        include:
          - os: ubuntu-24.04
            target: linux-x64-gnu
          - os: macos-15
            target: darwin-arm64
          - os: windows-2025
            target: win32-x64-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: consumers-${{ matrix.target }}
          path: .
      - run: node scripts/test.js
      - run: node scripts/build-isolation.test.cjs
      - run: node scripts/runtime-boundary.test.cjs
      - run: node scripts/structured-types.test.cjs
      - run: node --expose-gc scripts/class.test.cjs
      - run: node --expose-gc scripts/callback.test.cjs
      - run: node scripts/lifecycle.test.cjs
      - run: node scripts/async-runtime.test.cjs
      - run: node --expose-gc scripts/async-exports.test.cjs ./.napi-mbt/async-exports/napi_mbt.node

  minimum:
    name: Minimum Node ${{ matrix.node }} (${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '10.16.0'
            mode: cjs
          - node: '12.20.0'
            mode: dual
          - node: '12.22.0'
            mode: async
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: consumers-linux-x64-gnu
          path: .
      - run: node scripts/minimum-node.test.cjs ${{ matrix.mode }}

  memory:
    name: Native memory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: moon update
      - run: moon run scripts/toolchain-check.mbtx
      - run: moon build --target native --release cmd/napi-mbt-cli
      - run: moon run scripts/sanitizer-test.mbtx

  compatibility:
    name: Latest MoonBit compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: latest
          core-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: moon update
      - run: moon build --target native --release cmd/napi-mbt-cli
      - run: moon check --target native --warn-list +73 --deny-warn
      - run: moon test --target native cmd/napi-mbt-cli generator internal/syntax internal/assets
      - run: moon run scripts/async-exports-test.mbtx _build/native/release/build/cmd/napi-mbt-cli/napi-mbt-cli.exe

  release:
    name: Release archives
    needs: [build, node, minimum, memory, compatibility]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: napi-mbt-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
