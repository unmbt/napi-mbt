name: CI & Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux is temporarily disabled due to NAPI TLS/ELF namespace issues
          # - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build (CLI & Example)
        run: pnpm run build

      - name: Test (Example Native Bindings)
        run: pnpm run test

  release:
    name: Publish and Release
    needs: test
    # 只有推送到 master 分支才执行发包/PR 流程
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # changesets 需要写入 github release 和 commit
      pull-requests: write  # changesets 需要创建和更新 version PR
      id-token: write       # npm provenance (可信发布) 必备权限
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build CLI
        run: pnpm run build --filter=@unmbt/napi-mbt-cli

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
